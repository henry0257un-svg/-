<!doctype html>
<html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MEMORY_404｜Story</title><link rel="stylesheet" href="style.css"></head>
<body><div class="page"><img class="bg" id="storyBg" src="" alt=""><div class="overlay"></div><div class="topbar"><div><span class="dot"></span>PRIVATE MEMORY ARCHIVE</div><div id="clock">--:--</div></div>
<div class="center-card" style="justify-content:flex-end"><div class="glass" style="max-width:420px;margin-left:auto"><div class="eyebrow" id="eyebrow"></div><p class="story-sub" id="sub" style="margin-bottom:0">點擊繼續閱讀這一幕。</p><button class="btn secondary" id="next">下一幕</button><p class="small" style="margin-top:14px;text-align:center">TAP TO CONTINUE</p></div></div></div>
<script src="data.js"></script><script src="common.js"></script>
<script>
const c=getC(), ch=CHAPTERS[c]; let s=0;

function render(){
  const x = ch.scenes[s];
  document.getElementById('storyBg').src = 'c'+(c+1)+'_s'+(s+1)+'.png';
  eyebrow.textContent = ch.num + ' · 第 ' + (s+1) + ' 幕';
  sub.textContent = x.eyebrow;
  next.textContent = s===ch.scenes.length-1 ? '故事結束｜前往章節' : '下一幕';
}
next.onclick = ()=>{
  if(s < ch.scenes.length - 1){ s++; render(); }
  else location.href='chapter.html?c='+c;
};
render();
</script></body></html>
